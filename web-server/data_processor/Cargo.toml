[package]
name = "data_processor"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = { version = "0.31.0", features = ["serde"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_yaml = "0.9.32"
serde_json = "1.0.114"
anyhow = "1.0.83"
rusqlite = { version = "0.31.0", features = ["bundled"] }
structopt = "0.3.26"

[profile.dev]
incremental = true
lto = false
debug = 2