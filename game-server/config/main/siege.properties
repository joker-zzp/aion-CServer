#
# ----------------------------
# Basic siege config's:
# 基本攻城战配置：
# ----------------------------

# Enable siege system
# 启用攻城战系统
# 控制游戏中攻城战系统的开启或关闭
# Default: true
gameserver.siege.enable = true

# Enable automatic Balaur Assaults
# 启用自动龙族袭击
# 控制游戏中龙族是否会自动发起袭击
# 默认值：true
gameserver.siege.assault.enable = true

# Rate for Balaur assaults chance(float)
# 龙族袭击概率倍率(浮点数)
# 调整龙族袭击发生的概率
# Default: 1
gameserver.siege.assault.rate = 1

# Moltenus spawn time
# 莫尔托诺斯刷新时间
# 设置世界Boss莫尔托诺斯的刷新时间表
# Default: 0 0 22 ? * SUN
gameserver.moltenus.time = 0 0 15 ? * SUN

# Fortress boss health multiplier (1.0 = 100%, 0.5 = 50%)
# 要塞Boss血量倍率(1.0 = 100%，0.5 = 50%)
# 调整要塞Boss的生命值倍数
# Default: 1.0
gameserver.siege.health.multiplier.fortress = 0.1

# Artifact boss health multiplier (1.0 = 100%, 0.5 = 50%)
# 神器Boss血量倍率(1.0 = 100%，0.5 = 50%)
# 调整神器Boss的生命值倍数
# Default: 1.0
gameserver.siege.health.multiplier.artifact = 0.1

# Base boss health multiplier (1.0 = 100%, 0.5 = 50%)
# 基地Boss血量倍率(1.0 = 100%，0.5 = 50%)
# 调整基地Boss的生命值倍数
# Default: 1.0
gameserver.siege.health.multiplier.base = 0.1

# Siege and Assault difficulty multiplier
# 攻城战和袭击难度倍率
# 调整整个攻城战和袭击事件的难度
# Default: 1.0
gameserver.siege.difficulty.multiplier = 1.0

# Panesterra player limit per faction
# 潘内斯特拉地区每阵营玩家上限
# 设置潘内斯特拉地区每个阵营的最大玩家数量
# Default: 100
gameserver.siege.panesterra.maxplayers = 100

# Ahserion's Flight player limit per faction
# 阿舍里翁之翼每阵营玩家上限
# 设置阿舍里翁之翼区域每个阵营的最大玩家数量
# Default: 100
gameserver.siege.panesterra.ahserion.maxplayers = 100

# Ahserion's Flight schedule
# 阿舍里翁之翼活动时间表
# 设置阿舍里翁之翼活动的开启时间
# Default: 0 50 18 ? * *
gameserver.siege.panesterra.ahserion.time = 0 50 18 ? * SUN

# Heal amount(%) recovered with each activation
# 每次激活时恢复的生命值百分比
# 设置城门修复时每次恢复的生命值百分比
# Default: 0.01
gameserver.siege.door.repair.heal.percent = 0.01

# Enables/Disables rewards for players if balaur succeed in sieges
# 启用/禁用龙族攻城成功时玩家获得奖励
# 控制当龙族成功攻占要塞时是否给玩家发放奖励
# Default: false
gameserver.siege.reward.balaur.victory = false

# Ignore staff members on location clear
# 清空区域时忽略工作人员
# 控制在清空攻城区域时是否忽略GM等工作人员
# Default: false
gameserver.siege.ignore_staff_on_location_clear = false